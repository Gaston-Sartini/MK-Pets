# ─────────────────────────────────────────────────────────────────────────────
# MK-Pets — Evolution API para producción (VPS)
#
# Levanta lo mínimo para mandar WhatsApp desde el sitio:
#   caddy      HTTPS automático (Let's Encrypt) delante de Evolution
#   evolution  API de WhatsApp
#   postgres   sesiones y datos de Evolution
#   redis      caché de Evolution
#
# Solo Caddy queda expuesto a internet (puertos 80 y 443). Evolution, Postgres y
# Redis no publican puertos: se llega a Evolution únicamente por HTTPS y con API key.
#
# Pasos: ver README.md en esta carpeta.
# ─────────────────────────────────────────────────────────────────────────────

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WA_DOMAIN: ${WA_DOMAIN}
    command: caddy reverse-proxy --from ${WA_DOMAIN} --to evolution:8080
    volumes:
      - caddy_data:/data
    depends_on:
      - evolution

  evolution:
    # Versión fijada: es la que se probó con el sitio. Actualizar a conciencia.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: https://${WA_DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LANGUAGE: es
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: mkpets
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # El sitio solo ENVÍA avisos: no hace falta guardar chats ni contactos del teléfono.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      CONFIG_SESSION_PHONE_CLIENT: MK-Pets
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  evolution_instances:
  postgres_data:
  redis_data:
