# ─────────────────────────────────────────────────────────────────────────────
# Typebot self-hosted — stack mínimo para MK-Pets
#
# Servicios:
#   - typebot-db       PostgreSQL (storage de los flows + chats)
#   - typebot-builder  UI para crear/editar flows           → http://localhost:8080
#   - typebot-viewer   Runtime del bubble que se embebe     → http://localhost:8081
#
# Cómo correrlo (desde la carpeta infra/typebot/):
#   docker compose up -d
#
# Para apagarlo:
#   docker compose down
#
# Logs:
#   docker compose logs -f typebot-builder
# ─────────────────────────────────────────────────────────────────────────────

services:
  typebot-db:
    image: postgres:16-alpine
    container_name: typebot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       typebot
      POSTGRES_USER:     typebot
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - typebot_db_data:/var/lib/postgresql/data
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U typebot']
      interval: 5s
      timeout:  3s
      retries:  10

  typebot-builder:
    image: baptistearno/typebot-builder:3.15.2
    container_name: typebot-builder
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
    ports:
      - '8080:3000'
    environment:
      # URLs públicas (ajustá si vas a exponer detrás de un proxy)
      NEXTAUTH_URL:      http://localhost:8080
      NEXT_PUBLIC_VIEWER_URL: http://localhost:8081

      # Postgres
      DATABASE_URL: postgresql://typebot:${DATABASE_PASSWORD}@typebot-db:5432/typebot

      # Secrets
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXTAUTH_SECRET:   ${NEXTAUTH_SECRET}

      # Auth admin: dejá tu email para que la primera vez que entres te haga admin
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # SMTP (dev local: sin servidor real, Typebot loguea el magic link en consola).
      # Configurarlos activa el provider de email para que aparezca el botón de login.
      SMTP_HOST:             ${SMTP_HOST}
      SMTP_PORT:             ${SMTP_PORT}
      SMTP_USERNAME:         ${SMTP_USERNAME}
      SMTP_PASSWORD:         ${SMTP_PASSWORD}
      SMTP_SECURE:           ${SMTP_SECURE}
      SMTP_AUTH_DISABLED:    ${SMTP_AUTH_DISABLED}
      # ¡Variable PÚBLICA (next.js)! La que ACTIVA el provider en el frontend.
      NEXT_PUBLIC_SMTP_FROM: ${NEXT_PUBLIC_SMTP_FROM}

      DISABLE_SIGNUP:    'false'
      NEXT_PUBLIC_E2E_TEST: 'false'
      # Logs de diagnóstico — nos dice exactamente qué provider detecta
      TYPEBOT_DEBUG: 'true'

  typebot-viewer:
    image: baptistearno/typebot-viewer:3.15.2
    container_name: typebot-viewer
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
    ports:
      - '8081:3000'
    environment:
      NEXTAUTH_URL:      http://localhost:8080
      NEXT_PUBLIC_VIEWER_URL: http://localhost:8081
      DATABASE_URL:      postgresql://typebot:${DATABASE_PASSWORD}@typebot-db:5432/typebot
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXTAUTH_SECRET:   ${NEXTAUTH_SECRET}

  mailpit:
    image: axllent/mailpit
    container_name: typebot-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  typebot_db_data:
