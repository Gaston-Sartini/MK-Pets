name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Los PR desde forks no reciben los secrets de Netlify: no hay nada que desplegar.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Deploy de borrador (sin --prod): Netlify devuelve una URL única y no toca
      # el sitio publicado. Usa las variables de entorno configuradas en Netlify.
      - name: Build & deploy preview
        run: npx netlify-cli@26 deploy --build --site=${{ secrets.NETLIFY_SITE_ID }} --message "PR ${{ github.event.pull_request.number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
