name: Deploy

on:
  push:
    branches: [main]
    # Documentación e infraestructura no cambian el sitio: no gastar un deploy.
    paths-ignore:
      - 'docs/**'
      - 'infra/**'
      - '**/*.md'
      - 'scripts/**'
      - '.github/workflows/chat-eval.yml'
      - '.github/workflows/backup.yml'
      - '.github/workflows/uptime.yml'
  workflow_dispatch:      # allow manual deploys from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false    # never cancel an in-flight deploy

env:
  NODE_VERSION: '22'

jobs:
  # ── Gate: all CI checks must pass ─────────────────────────────────────────
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Deploy to Netlify ──────────────────────────────────────────────────────
  deploy:
    name: Deploy → Netlify (production)
    runs-on: ubuntu-latest
    needs: ci-gate
    environment:
      name: production
      url: https://mk-pets.netlify.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Las variables de la app (base de datos, Supabase, IA, WhatsApp…) viven en
      # Netlify → Site configuration → Environment variables. `netlify deploy --build`
      # las baja solo para el build y son las que usa el sitio en ejecución.
      # No se duplican como secrets de GitHub: tenerlas en dos lugares es la forma
      # más fácil de desplegar con un valor viejo.
      - name: Build & Deploy to Netlify
        run: npx netlify-cli@26 deploy --build --prod --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS https://mk-pets.netlify.app/api/health
